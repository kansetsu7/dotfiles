# `screen-256color` used to be required here: lazygit's tcell had no built-in
# `tmux-256color` terminfo entry, so it failed to render (lazygit#2962).
# tcell v2.8.0 added the entry, shipped in lazygit v0.45.2 — so the workaround
# is no longer needed, and we get italics/underline styles that
# `screen-256color` lacks. Matches `tmux-mac.conf`.
set-option default-terminal "tmux-256color"

# tcell's built-in `tmux-256color` entry declares 256 colors but no RGB caps,
# so it only enables 24-bit color when COLORTERM says so (lazygit#3668, open).
# Outside docker the outer terminal exports this; here it is lost, so set it
# explicitly. tmux itself already advertises RGB via the `*256col*` override
# in `tmux.conf`.
set-environment -g COLORTERM truecolor

# Easy config reload
# bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# Override clipboard commands to use xclip wrapper (syncs to macOS via socat)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip"

# Extended keys: let pi (and other CSI-u aware TUIs) receive modified Enter, etc.
set -g extended-keys on
set -g extended-keys-format csi-u
