gui:
  sidePanelWidth: 0.25
  mouseEvents: false
os:
  # In the container there is no xclip/xsel, so copy via OSC 52 — tmux
  # (set-clipboard on) intercepts it and forwards it to the host terminal.
  # On macOS lazygit can reach the real clipboard, so skip the OSC 52 detour
  # and its dependencies (tmux passthrough, terminal clipboard permission).
  copyToClipboardCmd: |
    if [ -e /.dockerenv ]; then
      printf "\033]52;c;%s\a" "$(printf '%s' {{text}} | base64 -w 0)" > /dev/tty
    else
      printf '%s' {{text}} | pbcopy
    fi
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never
  commit:
    verbose: always
keybinding:
  universal:
    quit: 'Q'
    return: 'q'
customCommands:
  - key: 'F'
    context: 'localBranches'
    command: 'git checkout -b {{.SelectedLocalBranch.Name}}-fork'
    description: 'Create fork branch from selected'
  - key: 'B'
    context: 'localBranches'
    command: 'branch={{.SelectedLocalBranch.Name}}; git checkout ${branch%-fork}'
    description: 'Return to original branch (strip -fork suffix)'
  - key: 'S'
    context: 'localBranches'
    command: 'zsh -c switch_to_tmp_branch'
    description: 'Switch to personal tmp branch and rebase'
  - key: 'D'
    context: 'localBranches'
    prompts:
      - type: 'confirm'
        title: 'Delete branch'
        body: 'Switch to tmp branch and delete {{.SelectedLocalBranch.Name}} ?'
    command: 'zsh -c switch_to_tmp_branch && git branch -D {{.SelectedLocalBranch.Name}}'
    description: 'Switch to tmp branch and delete selected branch'
